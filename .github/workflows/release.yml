name: Release Libby Dashboard KOReader Plugin

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: libby-dashboard-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate plugin version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F'"' '/^[[:space:]]*version[[:space:]]*=/ { print $2; exit }' libby-dashboard.koplugin/_meta.lua)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Plugin version in _meta.lua must be a semantic version (x.y.z); got: $version" >&2
            exit 1
          fi
          tag="v${version}"
          readme_version=$(sed -n 's/^Current plugin version: \*\*\([^*]*\)\*\*$/\1/p' README.md)
          if [[ "$readme_version" != "$version" ]]; then
            echo "README version must match _meta.lua; README=$readme_version plugin=$version" >&2
            exit 1
          fi
          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF_NAME}" != "$tag" ]]; then
            echo "Pushed tag must match plugin version; pushed=${GITHUB_REF_NAME} expected=${tag}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Install Lua 5.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Validate plugin Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          find libby-dashboard.koplugin -maxdepth 1 -type f -name '*.lua' -print0 | sort -z | xargs -0 -n1 /usr/bin/luac5.1 -p

      - name: Validate plugin package
        shell: bash
        run: |
          set -euo pipefail
          test -f libby-dashboard.koplugin/_meta.lua
          test -f libby-dashboard.koplugin/main.lua
          test -f libby-dashboard.koplugin/libby_dashboard_updater.lua

      - name: Build plugin archive
        shell: bash
        run: |
          set -euo pipefail
          zip -qr libby-dashboard.koplugin.zip README.md libby-dashboard.koplugin
          unzip -Z1 libby-dashboard.koplugin.zip | grep -Fxq "README.md"
          unzip -Z1 libby-dashboard.koplugin.zip | grep -Fxq "libby-dashboard.koplugin/main.lua"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          gh release create "$tag" libby-dashboard.koplugin.zip \
            --title "$tag" \
            --generate-notes
